name: Wheels

on:
  push:
    branches:
        - '**'
    paths-ignore:
        - docs/**
        - ChangeLog*
    tags:
        - 'v[0-9]+.[0-9]+.[0-9]+'
        - 'v[0-9]+.[0-9]+.[0-9]+rc[0-9]+'
  pull_request:
    branches:
        - '**'
    paths-ignore:
        - docs/**
        - ChangeLog*

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  build_sdist:

    name: SDist
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Build sdist
        run: |
            python -m pip install build
            python -m build --sdist --outdir wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: pymssql-sdist-${{ github.sha }}
          path: wheelhouse

  free_threaded:
    name: Free-threaded CPython ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13t", "3.14t", "3.15t"]
    env:
      PYTHON_GIL: "0"
      PYMSSQL_TEST_SERVER: localhost
      PYMSSQL_TEST_USERNAME: sa
      PYMSSQL_TEST_PASSWORD: sqlServerPassw0rd
      PYMSSQL_TEST_DATABASE: tempdb
    services:
      SQLServer:
        image: mcr.microsoft.com/mssql/server:2017-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: sqlServerPassw0rd
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FreeTDS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libssl-dev
      - name: Build and install pymssql
        env:
          LINK_FREETDS_STATICALLY: "YES"
          LINK_KRB5: "YES"
          LINK_OPENSSL: "YES"
          PYMSSQL_FREETDS_INCLUDEDIR: /usr/include
          PYMSSQL_FREETDS_LIBDIR: /usr/lib/x86_64-linux-gnu
        run: python -m pip install .
      - name: Install test dependencies
        run: python -m pip install -r dev/requirements-test-base.txt
      - name: Test free-threaded extensions
        run: python -m pytest -sv tests/test_gil_safety.py tests/test_free_threaded.py

  build-wheels-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set-matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install cibuildwheel==4.2.0
      - id: set-matrix
        run: |
          MATRIX_INCLUDE=$(
            {
              cibuildwheel --print-build-identifiers --platform linux --archs x86_64 | grep cp |  jq -nRc '{"only": inputs, "os": "ubuntu-latest"}'
            } | jq -sc
          )
          echo "include=$MATRIX_INCLUDE" >> $GITHUB_OUTPUT

  build_wheels:

    needs: build-wheels-matrix
    name: ${{ matrix.only }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build-wheels-matrix.outputs.include) }}

    services:
      SQLServer:
        image: mcr.microsoft.com/mssql/server:2017-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: sqlServerPassw0rd
        ports:
          - 1433:1433

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pypa/cibuildwheel@v4.2.1
        with:
          only: ${{ matrix.only }}
        env:
          #CIBW_BUILD_VERBOSITY: 1
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_I686_IMAGE: manylinux_2_28

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.only }}
          path: wheelhouse

  build_wheels_2:

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-14, macos-15-intel]
        arch: [auto]

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse

  build_wheels_windows:

    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        arch: [AMD64]

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install OpenSSL AMD64
        if: matrix.arch == 'AMD64'
        run: choco install openssl

      - name: Install gperf
        run: choco install gperf

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse

  build_freethreaded_wheels:
    name: Free-threaded wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: windows-latest
            arch: AMD64
    steps:
      - uses: actions/checkout@v7

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install OpenSSL
        if: runner.os == 'Windows'
        run: choco install openssl

      - name: Install gperf
        if: runner.os == 'Windows'
        run: choco install gperf

      - name: Build and test free-threaded wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: "cp314t-* cp315t-*"
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT_MACOS: "PYTHON_GIL=0"
          CIBW_ENVIRONMENT_WINDOWS: "PYTHON_GIL=0"
          CIBW_TEST_COMMAND: >-
            python -m pytest
            {project}/tests/test_gil_safety.py::test_extensions_import_without_enabling_gil
            {project}/tests/test_gil_safety.py::test_gil_remains_disabled_after_import

      - uses: actions/upload-artifact@v7
        with:
          name: freethreaded-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse

  merge_wheels:
    needs: [build_wheels, build_wheels_2, build_wheels_windows, build_freethreaded_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v7
        with:
          name: wheels
          separate-directories: false
          delete-merged: false

  check_wheels:
    needs: [merge_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist/

      - name: Check wheels
        run: |
            # upgrade packaging for PEP 639
            python -m pip install packaging>=24.2 --upgrade
            python -m pip install twine --upgrade
            python -m twine check --strict dist/*

  upload-wheels:
    needs: [check_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist/

      - name: Publish wheels and sdist
        if: github.repository_owner == 'pymssql' && startsWith(github.ref, 'refs/tags/v')
        run: |
            # upgrade packaging for PEP 639
            python -m pip install packaging>=24.2 --upgrade
            python -m pip install twine --upgrade
            twine upload --skip-existing -u __token__ -p ${{secrets.PYMSSQL_PYPI_TOKEN}} dist/*

      #- name: Publish wheels and sdist on test.pypi.org
        #if: github.repository_owner == 'pymssql' && github.ref == 'refs/heads/master'
        #run: |
            ## upgrade packaging for PEP 639
            #python -m pip install packaging>=24.2 --upgrade
            #python -m pip install twine --upgrade
            #twine upload --skip-existing -u __token__ -p ${{secrets.PYMSSQL_TEST_PYPI_TOKEN}} --repository-url=https://test.pypi.org/legacy/ dist/*
